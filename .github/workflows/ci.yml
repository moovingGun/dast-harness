name: CI

on:
  push:
    branches: [main]
  # No base-branch filter on purpose. With `branches: [main]` a PR stacked on
  # another PR ran no tests at all — the checks list showed only third-party
  # reviewers, which reads as "CI passed" at a glance. A bug that the suite
  # would have caught reached review that way.
  # `push` stays pinned to main so branch pushes don't duplicate the PR run.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No third-party deps: the suite is standard-library only and uses fake /
      # scripted scanners, so nuclei/nikto are not required in CI.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install package and smoke-test the console script
        run: |
          python -m pip install .
          dast-harness --help
