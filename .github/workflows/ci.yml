name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No third-party deps: the suite is standard-library only and uses fake /
      # scripted scanners, so nuclei/nikto are not required in CI.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install package and smoke-test the console script
        run: |
          python -m pip install .
          dast-harness --help
